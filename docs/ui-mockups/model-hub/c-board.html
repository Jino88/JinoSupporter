<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Model Hub — C. Portfolio Board + Drawer</title>
<link rel="stylesheet" href="../mockup.css" /><link rel="stylesheet" href="hub.css" />
<style>
  .gsel .tg-h.pick { background: var(--accent-soft); color: var(--accent-ink); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .mc { padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; transition: border-color .15s, transform .15s; }
  .mc:hover { border-color: #c7d2fe; transform: translateY(-1px); }
  .mc.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .mc h3 { margin: 0; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  .mc .mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .mc .mini div { background: #f8fafc; border-radius: 7px; padding: 6px 8px; }
  .mc .mini span { display: block; font-size: 10px; color: var(--muted); font-weight: 600; }
  .mc .mini b { font-size: 13px; }
  .mc .stepper .step span { display: none; }
  .mc .stepper .step i { width: 16px; height: 16px; font-size: 9px; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 62vw); background: #fff; border-left: 1px solid var(--line); box-shadow: -12px 0 40px rgba(15, 23, 42, .12); transform: translateX(100%); transition: transform .2s; display: flex; flex-direction: column; z-index: 10; }
  .drawer.open { transform: none; }
  .dr-h { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; }
  .dr-h h2 { margin: 2px 0; font-size: 20px; }
  .dr-b { overflow-y: auto; padding: 12px 20px 30px; }
  details.acc { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; background: #fff; }
  details.acc summary { padding: 11px 14px; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; list-style: none; }
  details.acc summary::-webkit-details-marker { display: none; }
  details.acc summary .cnt { font-size: 11px; color: var(--muted); font-weight: 600; }
  details.acc[open] summary { border-bottom: 1px solid var(--line-soft); }
  details.acc > div { padding: 12px 14px; }
  .board-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
</style></head>
<body>
<div class="shell"><aside class="rail" id="rail"></aside>
<main class="main"><div class="page hub">
  <aside class="card side">
    <div class="side-h"><h2>Model groups</h2></div>
    <div class="tree gsel" id="groups"></div><div id="legend"></div>
  </aside>
  <section>
    <div class="board-h"><div><div class="ph-crumb" id="crumb"></div><h1 style="margin:2px 0;font-size:22px" id="title"></h1></div>
      <div class="ph-actions"><div class="seg" id="sort"><button class="on" data-s="phase">By phase</button><button data-s="issue">By open issues</button><button data-s="ng">By NG rate</button></div><button class="btn primary">+ New model</button></div></div>
    <div class="cards" id="cards"></div>
  </section>
</div></main></div>
<aside class="drawer" id="drawer"></aside>
<div class="variant-tag">C · Portfolio Board + Drawer <a href="index.html">All drafts</a></div>
<script src="../mockup.js"></script><script src="hub.js"></script>
<script>
renderRail("");
document.getElementById("legend").innerHTML = PHASE_LEGEND;
let groupPath = ["MODULE", "MSM"], sel = new URLSearchParams(location.search).get("m"), sort = "phase";

function groupAt(path) { let list = GROUPS, g = null; for (const n of path) { g = list.find((x) => x.name === n); list = g.children || []; } return g; }

function drawGroups() {
  const node = (g, path, depth) => {
    const p = [...path, g.name], on = p.join("/") === groupPath.join("/");
    return `<div class="tg d${Math.min(depth, 1)}"><div class="tg-h ${on ? "pick" : ""}" data-p="${p.join("/")}"><span class="caret">▾</span>${g.name}<span class="cnt">${allModelsOf(g).length}</span></div>${(g.children || []).map((c) => node(c, p, depth + 1)).join("")}</div>`;
  };
  const el = document.getElementById("groups");
  el.innerHTML = `<div class="tg d0"><div class="tg-h ${groupPath.length ? "" : "pick"}" data-p="">ALL MODELS<span class="cnt">${allModels().length}</span></div></div>` + GROUPS.map((g) => node(g, [], 0)).join("");
  el.querySelectorAll(".tg-h").forEach((h) => h.addEventListener("click", (e) => { e.stopPropagation(); groupPath = h.dataset.p ? h.dataset.p.split("/") : []; sel = null; draw(); }));
}

function drawCards() {
  const names = groupPath.length ? allModelsOf(groupAt(groupPath)) : allModels().map((m) => m.name);
  const recs = names.map(modelRecord);
  const open = (r) => r.issues.filter((i) => i.status === "Open").length;
  recs.sort(sort === "phase" ? (a, b) => b.phaseIdx - a.phaseIdx : sort === "issue" ? (a, b) => open(b) - open(a) : (a, b) => b.ngPpm - a.ngPpm);
  document.getElementById("crumb").textContent = groupPath.length ? groupPath.join(" › ") : "All groups";
  document.getElementById("title").textContent = `${groupPath.at(-1) || "All models"} · ${recs.length} models`;
  document.getElementById("cards").innerHTML = recs.map((r) => `
    <div class="card mc ${r.name === sel ? "on" : ""}" data-m="${r.name}">
      <h3>${r.name}<span class="pill" style="height:20px;font-size:10.5px"><span class="ph-dot p${r.phaseIdx}"></span>${r.phase}</span></h3>
      <div class="muted" style="font-size:11.5px">${r.customer} · ${r.build} · ${r.owner}</div>
      ${phaseStepper(r)}
      <div class="mini"><div><span>Open issues</span><b style="${open(r) ? "color:var(--warn)" : ""}">${open(r)}</b></div><div><span>NG PPM</span><b>${fmt(r.ngPpm)}</b></div><div><span>Last review</span><b><span class="res ${resCls(r.reviews[0].result)}">${r.reviews[0].result}</span></b></div></div>
    </div>`).join("");
  document.querySelectorAll(".mc").forEach((c) => c.addEventListener("click", () => { sel = c.dataset.m; draw(); }));
}

function drawDrawer() {
  const d = document.getElementById("drawer");
  if (!sel) { d.classList.remove("open"); return; }
  const rec = modelRecord(sel);
  const acc = (title, cnt, body, open = false) => `<details class="acc" ${open ? "open" : ""}><summary>${title}<span class="cnt">${cnt}</span></summary><div>${body}</div></details>`;
  d.innerHTML = `<div class="dr-h"><div><div class="ph-crumb">${rec.path.join(" › ")}</div><h2>${rec.name}</h2><div class="muted">${rec.customer} · ${rec.build} · ${rec.phase}</div></div>
      <div class="ph-actions"><button class="btn">Open full page</button><button class="btn ghost" id="close">✕</button></div></div>
    <div class="dr-b">
      ${acc("1. Model Info", "", infoGrid(rec), true)}
      ${acc("2. Dev Plan", "Production Input", milestoneGantt(rec) + "<div style='height:12px'></div>" + planTable(rec, { compact: true }))}
      ${acc("3. Dev History", rec.history.length + " entries", historyList(rec))}
      ${acc("4. Issues", rec.issues.filter((i) => i.status === "Open").length + " open / " + rec.issues.length, issueTable(rec))}
      ${acc("5. Reviews", rec.reviews.length + " reviews", reviewTable(rec))}
    </div>`;
  d.classList.add("open");
  document.getElementById("close").addEventListener("click", () => { sel = null; draw(); });
}

document.querySelectorAll("#sort button").forEach((b) => b.addEventListener("click", () => {
  sort = b.dataset.s; document.querySelectorAll("#sort button").forEach((x) => x.classList.toggle("on", x === b)); draw();
}));
function draw() { drawGroups(); drawCards(); drawDrawer(); }
draw();
</script>
</body></html>
