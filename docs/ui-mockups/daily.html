<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Daily Report — redesign mockup</title>
<link rel="stylesheet" href="mockup.css" />
<style>
  .readings { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; padding: 0; overflow: hidden; margin-bottom: 14px; }
  .rd { padding: 14px 16px; border-right: 1px solid var(--line); }
  .rd:last-child { border-right: 0; }
  .rd:nth-child(3) { border-right: 2px solid var(--line); }
  .rd-k { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; color: var(--muted); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rd-v { font-size: 22px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .rd-v.up { color: var(--bad); } .rd-v.down { color: var(--good); }
  .rd-n { font-size: 11px; color: var(--faint); margin-top: 2px; }
  .ctl { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .ctl .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
  table.dr { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12px; font-variant-numeric: tabular-nums; }
  table.dr th { position: sticky; top: 0; background: #f8fafc; text-align: left; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--ink-2); padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: bottom; }
  table.dr th span { display: block; font-size: 9.5px; font-weight: 500; letter-spacing: .02em; color: var(--faint); margin-top: 2px; text-transform: none; }
  table.dr th.n, table.dr td.n { text-align: right; }
  table.dr th button { border: 0; background: none; padding: 0; font: inherit; color: var(--accent-ink); cursor: pointer; }
  table.dr td { padding: 12px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  table.dr td:first-child, table.dr th:first-child { padding-left: 16px; }
  table.dr td:last-child, table.dr th:last-child { padding-right: 16px; }
  tr.band td { padding: 8px 16px; font-size: 11px; font-weight: 800; letter-spacing: .08em; }
  tr.band.worse td { background: var(--bad-soft); color: var(--bad); border-top: 2px solid #fecaca; }
  tr.band.better td { background: var(--good-soft); color: var(--good); border-top: 2px solid #a7f3d0; }
  tr.band .cnt { margin-left: 10px; font-weight: 600; letter-spacing: 0; color: var(--muted); }
  .mn { font-weight: 700; font-size: 13px; display: block; }
  .mp { font-size: 11px; color: var(--muted); }
  .latest { font-size: 16px; font-weight: 700; }
  .base-v { font-weight: 600; color: var(--ink-2); display: block; }
  .base-p { font-size: 10.5px; color: var(--faint); }
  .gapb { margin-left: 4px; font-size: 9.5px; font-weight: 700; color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 0 4px; }
  .chg { font-size: 14px; font-weight: 700; display: block; }
  .chg.up { color: var(--bad); } .chg.down { color: var(--good); }
  .chg-p { font-size: 10.5px; color: var(--muted); }
  .causes { min-width: 470px; }
  .c-head, .c-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) 54px 54px 62px; gap: 8px; align-items: center; }
  .c-head { font-size: 9.5px; font-weight: 700; color: var(--faint); letter-spacing: .04em; padding-bottom: 4px; border-bottom: 1px dashed var(--line); margin-bottom: 4px; }
  .c-head span { text-align: right; } .c-head span strong { display: block; color: var(--muted); font-weight: 600; }
  .c-row { padding: 2.5px 0; }
  .c-row .nm { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-row .nm b { font-weight: 600; } .c-row .nm span { color: var(--muted); font-size: 11px; }
  .c-row .v { text-align: right; font-weight: 700; } .c-row .pv { text-align: right; color: var(--muted); }
  .c-row .d { text-align: right; font-weight: 700; } .c-row .d.up { color: var(--bad); } .c-row .d.down { color: var(--good); }
  .tg { font-size: 9.5px; font-weight: 800; text-align: center; border-radius: 4px; padding: 1px 0; background: #f1f5f9; color: var(--muted); }
  .tg.main { background: #0ea5e9; color: #fff; }
  .newb { font-size: 9.5px; font-weight: 800; color: #fff; background: var(--accent); border-radius: 4px; padding: 1px 5px; }
  .c-total { margin-top: 6px; font-size: 11px; color: var(--muted); }
  .c-total b { color: var(--ink); }
</style>
</head>
<body>
<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main class="main"><div class="page">

    <header class="ph">
      <div>
        <div class="ph-crumb">BMES · Defect rate trend by model</div>
        <h1>DAILY REPORT</h1>
        <div class="ph-sub"><span>2026-08-29 – 2026-10-28</span><span class="dot-sep">·</span><span>As of 10-29 06:00</span><span class="dot-sep">·</span><span>42 models</span></div>
      </div>
      <div class="ph-actions">
        <button class="btn"><i data-icon="refresh"></i> Refresh now</button>
        <a class="btn primary" href="report.html" style="text-decoration:none">Full report <i data-icon="arrow"></i></a>
      </div>
    </header>

    <section class="card readings" id="readings"></section>

    <div class="ctl">
      <div class="seg"><button class="on">WEEKLY</button><button>DAILY</button></div>
      <span class="lbl">GROUP</span>
      <div class="chips"><span class="chip on">All</span><span class="chip">SPK</span><span class="chip">Module</span><span class="chip">Unit</span><span class="chip">TWS</span></div>
    </div>

    <section class="card"><div class="tbl-wrap"><table class="dr" id="grid"></table></div></section>

  </div></main>
</div>
<div class="sample-note">Mockup · sample data · same table as the current page</div>

<script src="mockup.js"></script>
<script>
  renderRail("daily");

  const R = [
    ["Latest week · W43", "1,725", "overall PPM", ""], ["Baseline week · W42", "1,655", "last week with data", ""], ["Week change", "+70", "latest − baseline", "up"],
    ["Latest day · 10-28", "1,868", "overall PPM", ""], ["Baseline day · 10-27", "1,780", "last day with data", ""], ["Day change", "+88", "latest − baseline", "up"],
  ];
  document.getElementById("readings").innerHTML = R.map(([k, v, n, d]) => `<div class="rd"><div class="rd-k">${k}</div><div class="rd-v ${d}">${v}</div><div class="rd-n">${n}</div></div>`).join("");

  const tag = (t) => `<span class="tg ${t === "Main Assy" ? "main" : ""}">${{ "Main Assy": "MAIN", "Sub Assy": "SUB", "Function": "FUNC", "Final Visual": "VIS", "OQC": "OQC" }[t]}</span>`;
  const row = (r, i, kind) => {
    const d = r.now - r.base;
    const trendLatestFirst = [...r.t].reverse();
    return `<tr>
      <td><span class="rank ${i === 0 ? "r1" : ""}">${i + 1}</span></td>
      <td><span class="mn">${r.n}</span><span class="mp">${r.g} · ${r.p}</span></td>
      <td class="n"><span class="latest">${fmt(r.now)}</span></td>
      <td class="n"><span class="base-v">${fmt(r.base)}</span><span class="base-p">${r.bh}${r.gap ? `<span class="gapb">${r.gap}</span>` : ""}</span></td>
      <td class="n"><span class="chg ${deltaClass(d)}">${signed(d)}</span><span class="chg-p">${pct((d / r.base) * 100)}</span></td>
      <td>${sparkline(trendLatestFirst, { w: 120, h: 38, color: kind === "worse" ? "#dc2626" : "#059669" })}</td>
      <td><div class="causes">
        <div class="c-head"><span></span><span style="text-align:left"></span><span>CURRENT<strong>W43</strong></span><span>BASELINE<strong>${r.bh}</strong></span><span>CHANGE<strong>W43−${r.bh}</strong></span></div>
        ${r.c.map((c) => `<div class="c-row">${tag(c.t)}<span class="nm"><b>${c.n}</b><span> · ${c.p} · ${c.t}</span></span><span class="v">${fmt(c.v)}</span><span class="pv">${c.isNew ? "—" : fmt(c.v - c.d)}</span><span class="d ${c.isNew ? "" : deltaClass(c.d)}">${c.isNew ? '<span class="newb">NEW</span>' : signed(c.d)}</span></div>`).join("")}
        <div class="c-total"><b>${fmt(r.qty)}</b> defects in the latest week</div>
      </div></td></tr>`;
  };
  const C = (n, p, t, v, d, isNew = false) => ({ n, p, t, v, d, isNew });
  const worse = [
    { n: "MSM-X316B", g: "SPK", p: "MSM-X316", now: 3154, base: 2542, bh: "W42", qty: 412, t: [2400, 2500, 2380, 2450, 2520, 2480, 2460, 2500, 2490, 2470, 2542, 3154],
      c: [C("Glue overflow", "Voice coil bonding", "Main Assy", 860, 410), C("Rub & Buzz", "R&B test", "Function", 540, 160), C("Coil short", "Coil check", "Main Assy", 210, 0, true), C("Scratch", "Final appearance", "Final Visual", 180, -30), C("Welding offset", "Frame welding", "Sub Assy", 120, 20)] },
    { n: "MSM-X318B", g: "SPK", p: "MSM-X318", now: 1980, base: 1610, bh: "W41", gap: "2w", qty: 233, t: [1500, 1550, 1490, 1600, 1580, 1620, 1570, 1600, 1610, 1610, 1610, 1980],
      c: [C("Scratch", "Final appearance", "Final Visual", 620, 180), C("SPL low", "SPL measure", "Function", 300, 120), C("Dent", "Final appearance", "Final Visual", 140, 40), C("Glue overflow", "Diaphragm attach", "Main Assy", 110, -10), C("Label missing", "Packing check", "OQC", 40, 10)] },
  ];
  const better = [
    { n: "J69NAG", g: "Module", p: "J69 Speaker", now: 860, base: 1400, bh: "W42", qty: 96, t: [1500, 1480, 1520, 1460, 1440, 1450, 1420, 1410, 1390, 1380, 1400, 860],
      c: [C("Separate F-PCB", "F-PCB attach", "Sub Assy", 210, -320), C("Scratch", "Final appearance", "Final Visual", 180, -120), C("Rub & Buzz", "R&B test", "Function", 140, -40), C("Dent", "Visual inspection", "Final Visual", 90, -20), C("Glue overflow", "Voice coil bonding", "Main Assy", 70, -10)] },
  ];
  const band = (kind, label, list) => `<tr class="band ${kind}"><td colspan="7">${label}<span class="cnt">${list.length} model${list.length === 1 ? "" : "s"}</span></td></tr>` + list.map((r, i) => row(r, i, kind)).join("");
  document.getElementById("grid").innerHTML = `
    <colgroup><col style="width:46px"><col style="width:170px"><col style="width:90px"><col style="width:110px"><col style="width:96px"><col style="width:140px"><col></colgroup>
    <thead><tr><th>#</th><th><button>MODEL</button></th><th class="n"><button>LATEST</button><span>W43 PPM</span></th><th class="n">BASELINE<span>last week with data</span></th>
      <th class="n"><button>CHANGE</button><span>latest − baseline</span></th><th>TREND<span>LATEST ▶ OLDER</span></th>
      <th>TOP 5 DEFECT CAUSES<span>[TYPE] NG · PROCESS · ORIGINAL TYPE · CURRENT · BASELINE · CHANGE (CURRENT−BASELINE)</span></th></tr></thead>
    <tbody>${band("worse", "WORSENED", worse)}${band("better", "IMPROVED", better)}</tbody>`;
</script>
</body>
</html>
